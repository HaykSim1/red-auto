<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Auto — стенд агента</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --line: #e3e0d9; --text: #1d1c1a; --muted: #6f6b63;
    --accent: #c8102e; --user: #1d1c1a; --user-text: #ffffff; --bot: #efede8;
    --tool: #0b6b53; --err: #b3261e; --code: #f3f1ec;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --panel: #1e1d1b; --line: #33312d; --text: #ecebe7; --muted: #9c978d;
      --accent: #ff5a6e; --user: #ecebe7; --user-text: #151413; --bot: #2a2926;
      --tool: #5fd0ae; --err: #ff8a80; --code: #262522;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  header .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  section { min-height: 0; display: flex; flex-direction: column; }
  section + section { border-left: 1px solid var(--line); }
  .title { padding: 8px 16px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .scroll { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { margin-left: auto; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { background: transparent; border: 1px solid var(--err); color: var(--err); }
  .msg.pending { color: var(--muted); font-style: italic; }
  .msg.note { max-width: 100%; background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; text-align: center; }
  .empty { color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; height: 44px; }
  textarea:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .turn { margin-bottom: 18px; }
  .turn-head { font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
  .turn-total { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 6px; }
  .ev { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .ev-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; }
  .ev-kind { font-weight: 650; }
  .ev.tool .ev-kind { color: var(--tool); }
  .ev.err .ev-kind, .ev.limit .ev-kind { color: var(--err); }
  .ev-meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 3px; }
  pre { margin: 0; background: var(--code); border-radius: 6px; padding: 7px 9px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  details { border-bottom: 1px solid var(--line); padding: 8px 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details pre { margin-top: 8px; max-height: 260px; overflow: auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } section + section { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1><span>Red Auto</span> · стенд агента</h1>
  <span class="meta" id="model"></span>
  <span class="spacer"></span>
  <button id="reset" type="button">Новый диалог</button>
</header>
<main>
  <section>
    <div class="title">Диалог</div>
    <div class="scroll" id="chat"><p class="empty" id="chat-empty">Напишите сообщение, например: kalodka pradoi hamar</p></div>
    <form id="form">
      <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)" aria-label="Сообщение"></textarea>
      <button class="primary" id="send" type="submit">Отправить</button>
    </form>
  </section>
  <section>
    <div class="title">Что происходит внутри</div>
    <details>
      <summary>Что видит модель: системный промпт и инструменты</summary>
      <div class="label">system</div><pre id="cfg-system"></pre>
      <div class="label">tools</div><pre id="cfg-tools"></pre>
    </details>
    <div class="scroll" id="trace"><p class="empty" id="trace-empty">Здесь появится каждый шаг: запрос к модели, вызовы инструментов и их результаты.</p></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), trace = $('trace'), input = $('input'), sendBtn = $('send');
  let sessionId = crypto.randomUUID();
  let turnNo = 0;
  let busy = false;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  const json = (value) => typeof value === 'string' ? value : JSON.stringify(value, null, 2);

  function addMsg(kind, text) {
    $('chat-empty')?.remove();
    const node = el('div', 'msg ' + kind, text);
    chat.appendChild(node);
    chat.scrollTop = chat.scrollHeight;
    return node;
  }

  function block(parent, label, value) {
    parent.appendChild(el('div', 'label', label));
    parent.appendChild(el('pre', '', json(value)));
  }

  function renderEvent(ev) {
    if (ev.type === 'model') {
      const box = el('div', 'ev model');
      const head = el('div', 'ev-head');
      head.appendChild(el('span', 'ev-kind', 'Шаг ' + ev.step + ' · запрос к модели'));
      head.appendChild(el('span', 'ev-meta',
        'stop_reason=' + ev.stop_reason + ' · ' + ev.ms + ' мс · вход ' + ev.input_tokens +
        (ev.cache_read_tokens ? ' (+' + ev.cache_read_tokens + ' из кэша)' : '') + ' / выход ' + ev.output_tokens + ' ток.'));
      box.appendChild(head);
      if (ev.text) block(box, 'текст модели', ev.text);
      for (const call of ev.tool_calls) block(box, 'просит вызвать ' + call.name, call.input);
      return box;
    }
    if (ev.type === 'tool') {
      const box = el('div', 'ev tool' + (ev.is_error ? ' err' : ''));
      const head = el('div', 'ev-head');
      head.appendChild(el('span', 'ev-kind', (ev.is_error ? 'Ошибка инструмента ' : 'Ваш код исполнил ') + ev.name));
      head.appendChild(el('span', 'ev-meta', ev.ms + ' мс'));
      box.appendChild(head);
      block(box, 'аргументы', ev.input);
      block(box, 'результат, который ушёл модели', ev.output);
      return box;
    }
    const box = el('div', 'ev limit');
    box.appendChild(el('span', 'ev-kind', 'Остановлено: превышен лимит шагов'));
    return box;
  }

  function renderTurn(text, events, errorText) {
    $('trace-empty')?.remove();
    const turn = el('div', 'turn');
    turn.appendChild(el('div', 'turn-head', 'Ход ' + turnNo + ': «' + text + '»'));
    for (const ev of events) turn.appendChild(renderEvent(ev));
    if (errorText) {
      const box = el('div', 'ev err');
      box.appendChild(el('span', 'ev-kind', 'Ошибка: ' + errorText));
      turn.appendChild(box);
    }
    const models = events.filter((e) => e.type === 'model');
    if (models.length) {
      const sum = (key) => models.reduce((acc, e) => acc + e[key], 0);
      turn.appendChild(el('div', 'turn-total',
        'Итого: запросов к модели ' + models.length + ', вызовов инструментов ' + events.filter((e) => e.type === 'tool').length +
        ', вход ' + (sum('input_tokens') + sum('cache_read_tokens')) + ' / выход ' + sum('output_tokens') + ' ток., ' +
        events.reduce((acc, e) => acc + (e.ms || 0), 0) + ' мс'));
    }
    trace.appendChild(turn);
    trace.scrollTop = trace.scrollHeight;
  }

  async function loadConfig() {
    try {
      const cfg = await (await fetch('/api/config')).json();
      $('model').textContent = cfg.model;
      $('cfg-system').textContent = cfg.system.trim() || '(пусто — системный промпт не задан)';
      $('cfg-tools').textContent = JSON.stringify(cfg.tools, null, 2);
    } catch { /* сервер недоступен — покажет отправка сообщения */ }
  }

  async function send(text) {
    if (busy || !text) return;
    busy = true; sendBtn.disabled = true;
    turnNo += 1;
    addMsg('user', text);
    const pending = addMsg('bot pending', 'Агент работает…');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId, text }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        addMsg('error', 'Ошибка ' + res.status + ': ' + data.error + '\nСообщение не добавлено в историю диалога.');
        renderTurn(text, [], data.error);
      } else {
        if (data.configChanged) {
          const note = el('div', 'msg note', 'Вы изменили agent.ts, поэтому история сброшена: этот ответ уже из нового диалога с новыми настройками.');
          chat.insertBefore(note, pending.isConnected ? pending : chat.lastChild);
          turnNo = 1;
        }
        addMsg('bot', data.reply || '(модель не вернула текст)');
        renderTurn(text, data.events);
      }
    } catch (err) {
      pending.remove();
      addMsg('error', 'Сервер недоступен: ' + err.message);
    } finally {
      busy = false; sendBtn.disabled = false; input.focus();
      loadConfig();
    }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    input.value = '';
    send(text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
  });
  $('reset').addEventListener('click', async () => {
    if (busy) return;
    fetch('/api/reset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId }) }).catch(() => {});
    sessionId = crypto.randomUUID();
    turnNo = 0;
    chat.replaceChildren(el('p', 'empty', 'Новый диалог. История очищена.'));
    chat.firstChild.id = 'chat-empty';
    trace.replaceChildren(el('p', 'empty', 'Здесь появится каждый шаг.'));
    trace.firstChild.id = 'trace-empty';
    input.focus();
  });

  loadConfig();
  input.focus();
</script>
</body>
</html>
